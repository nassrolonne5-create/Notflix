[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci --include=dev --prefer-offline --no-audit"]
cacheDirectories = ["/root/.npm"]

[phases.build]
cmds = ["rm -rf dist server.js && npm run build && test -f dist/index.html && test -f server.js"]

[variables]
NODE_ENV = "production"
PORT = "3000"

[start]
cmd = "node server.js"
