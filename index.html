    <!-- Deployment Recovery, Sticky-Cookie Cleaner & Stale Cache Guard -->
    <script data-cfasync="false">
      (function() {
        var ua = (typeof navigator !== 'undefined' && navigator.userAgent) ? navigator.userAgent : '';
        var isBot = /googlebot|inspectiontool|googleother|storebot|bingbot|slurp|duckduckbot|baiduspider|yandex|applebot|twitterbot|facebookexternalhit|linkedinbot|telegrambot|whatsapp|discordbot|pinterest|ahrefsbot|semrushbot/i.test(ua);

        // Immediately strip any legacy ?_cb= query parameter in-place without triggering a navigation redirect
        try {
          if (window.location.search.indexOf('_cb=') !== -1 && window.history && window.history.replaceState) {
            var cleanUrl = new URL(window.location.href);
            cleanUrl.searchParams.delete('_cb');
            window.history.replaceState({}, document.title, cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
          }
        } catch (e) {}

        // Never run cookie-wiping or reload redirects inside search engine crawlers (prevents "Page with redirect" & "Alternate canonical" in GSC)
        if (isBot) return;

        // 1. Wipe any proxy sticky-session cookies that could pin Chrome to an old container after update
        function clearAllDomainCookies() {
          try {
            var cookies = document.cookie ? document.cookie.split(';') : [];
            for (var i = 0; i < cookies.length; i++) {
              var cookie = cookies[i];
              var eqPos = cookie.indexOf('=');
              var name = (eqPos > -1 ? cookie.substr(0, eqPos) : cookie).trim();
              if (name) {
                document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
                document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;domain=' + window.location.hostname;
              }
            }
          } catch (e) {}
        }
        clearAllDomainCookies();

        // 2. Unregister any stale Service Workers & clear Cache Storage
        try {
          if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
          }
          if ('caches' in window && window.caches.keys) {
            window.caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) {
                window.caches.delete(keys[i]);
              }
            }).catch(function() {});
          }
        } catch (e) {}

        // 3. Auto-recover if Chrome tries to load a superseded JS/CSS chunk during/after deployment (without polluting URL with ?_cb=)
        var isRecovering = false;
        function recoverAfterDeployment() {
          if (isRecovering) return;
          var lastReload = parseInt(sessionStorage.getItem('notflix_deploy_reload_ts') || '0', 10);
          if (Date.now() - lastReload < 8000) return;
          isRecovering = true;
          sessionStorage.setItem('notflix_deploy_reload_ts', String(Date.now()));
          clearAllDomainCookies();

          var attempts = 0;
          function checkServerReady() {
            attempts++;
            fetch('/api/health', {
              cache: 'no-store',
              headers: { 'Pragma': 'no-cache', 'Cache-Control': 'no-cache' }
            })
              .then(function(res) {
                if (res.ok) {
                  fetch(window.location.pathname, { cache: 'reload', headers: { 'Accept': 'text/html' } })
                    .catch(function() {})
                    .finally(function() {
                      window.location.reload();
                    });
                } else if (attempts < 15) {
                  setTimeout(checkServerReady, 1500);
                } else {
                  isRecovering = false;
                }
              })
              .catch(function() {
                if (attempts < 15) {
                  setTimeout(checkServerReady, 1500);
                } else {
                  isRecovering = false;
                }
              });
          }
          checkServerReady();
        }

        window.addEventListener('vite:preloadError', function(event) {
          event.preventDefault();
          recoverAfterDeployment();
        });

        window.addEventListener('error', function(event) {
          var t = event && event.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            var src = t.src || t.href || '';
            if (src.indexOf('/assets/') !== -1) {
              recoverAfterDeployment();
            }
          }
        }, true);
      })();

    <script data-cfasync="false">
      (function() {
        try {
          function checkIsAdminContext() {
            if (window.__NOTFLIX_IS_ADMIN__ === true) return true;
            var p = (window.location.pathname || '').toLowerCase();
            var h = (window.location.hash || '').toLowerCase();
            if (
              p === '/admin' ||
              p.indexOf('/admin') === 0 ||
              h === '#admin' ||
              h.indexOf('#admin') === 0 ||
              h.indexOf('#/admin') === 0 ||
              h.indexOf('#scraper') === 0
            ) {
              return true;
            }
            if (typeof document !== 'undefined' && document.getElementById('notflix-admin-studio-root')) {
              return true;
            }
            return false;
          }
          window.__isNotflixAdminRoute = checkIsAdminContext;

          if (checkIsAdminContext()) {
            window.__NOTFLIX_IS_ADMIN__ = true;
          }

          // 1. Wrap window.open at boot time BEFORE any ad script can cache a reference to native window.open
          var nativeWindowOpen = window.open;
          window.open = function(url, target, features) {
            if (checkIsAdminContext()) {
              return null;
            }
            return nativeWindowOpen ? nativeWindowOpen.apply(window, arguments) : null;
          };

          // 2. Wrap HTMLAnchorElement.prototype.click at boot time so synthetic popunder <a> clicks are blocked in Admin
          if (typeof HTMLAnchorElement !== 'undefined' && HTMLAnchorElement.prototype) {
            var nativeAnchorClick = HTMLAnchorElement.prototype.click;
            HTMLAnchorElement.prototype.click = function() {
              if (checkIsAdminContext()) {
                var href = String(this.getAttribute('href') || this.href || '');
                var hasDownload = this.hasAttribute('download');
                // Allow only explicit admin backup/export blob or data downloads
                if (!hasDownload || (href.indexOf('blob:') !== 0 && href.indexOf('data:') !== 0)) {
                  return;
                }
              }
              return nativeAnchorClick.apply(this, arguments);
            };
          }

          // 3. Only load Profiton popunder script when NOT in admin context
          if (!checkIsAdminContext()) {
            window.__NOTFLIX_POPUNDER_LOADED__ = true;
            var s = document.createElement('script');
            s.type = 'text/javascript';
            s.async = true;
            s.setAttribute('data-cfasync', 'false');
            s.referrerPolicy = 'strict-origin-when-cross-origin';
            s.id = 'profiton-pops-script';
            s.src = 'https://fz.liquidincan.com/r3VQROCRTG0zM/156800';
            (document.head || document.documentElement).appendChild(s);
          }
        } catch (e) {}
      })();
